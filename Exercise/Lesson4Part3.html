<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 4</title>
    <style>
        *{
         margin: 0;   
         padding: 0;
        }
        .js-container{
            height: 100vh;
            width: 100vw;
            background-color: rgb(222,222,222);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }
        .btns{
            background-color: rgb(25,135,84);
            border:none;
            padding: 10px;
            color: white;
            cursor: pointer;
            &:hover{
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="js-container">

    </div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function AutoClickButton({setCount,btnRef}){
            function startAutoClick() {
                if(btnRef){
                    setInterval(()=>{
                        btnRef.current.click();
                    },1000);
                }
            }
            return (
                <button onClick={startAutoClick} className="btns">Auto Click</button>
            );
        }

        function ResetButton({setCount}){
            function resetCount() {
                setCount(0);
            }
            return (
                <button onClick={resetCount} className="btns">Reset</button>
            );
        }

        function App(){
            const [ count, setCount ] = React.useState(0);
            const btnRef = React.useRef(null);
            function click(){
                setCount(count+1);
            }

            return (
                <>
                    {count==1 && (<button onClick={click} ref={btnRef} className="btns">Clicked {count} time</button>)}
                    {count!=1 && (<button onClick={click} ref={btnRef} className="btns">Clicked {count} times</button>)}
                    <ResetButton setCount={setCount}/>
                    <AutoClickButton setCount={setCount} btnRef={btnRef} />
                </>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>
</html>
